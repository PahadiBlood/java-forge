<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Category')}"></head>
<body>
<div th:replace="~{fragments :: header}"></div>

<main class="container">
    <div class="page-head">
        <div>
            <a class="crumb" th:href="@{/}">← Home</a>
            <h1 id="title">Category</h1>
        </div>
        <div class="category-tools">
            <div id="count" class="muted"></div>
            <label class="sort-control">Sort by
                <select id="sort-products" aria-label="Sort products">
                    <option value="featured">Featured</option>
                    <option value="name-asc">Name: A to Z</option>
                    <option value="price-asc">Price: low to high</option>
                    <option value="price-desc">Price: high to low</option>
                </select>
            </label>
        </div>
    </div>
    <div id="summary" class="summary"></div>
    <div id="grid" class="grid"></div>
    <div id="pager" class="pager"></div>
</main>

<div th:replace="~{fragments :: footer}"></div>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/category.js}"></script>
</body>
</html>
