<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' · mShop'">mShop</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="site-header" th:fragment="header">
    <div class="container bar">
        <a class="brand" th:href="@{/}">m<span>Shop</span></a>
        <form class="header-search" action="/search" method="get" role="search">
            <label class="sr-only" for="site-search">Search products</label>
            <input id="site-search" name="q" type="search" placeholder="Search products" autocomplete="off">
            <button type="submit" aria-label="Search">⌕</button>
            <div id="search-suggestions" class="search-suggestions" role="listbox" aria-label="Product suggestions" hidden></div>
        </form>
        <a class="dashboard-link" th:href="@{/dashboard}">Dashboard</a>
        <nav id="nav" class="nav"></nav>
    </div>
</header>
<footer class="site-footer" th:fragment="footer">
    <div class="container">mShop · your everyday marketplace</div>
</footer>
</body>
</html>
