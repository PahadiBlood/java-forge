<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Product')}"></head>
<body>
<div th:replace="~{fragments :: header}"></div>

<main class="container">
    <a class="crumb" href="javascript:history.back()">← Back</a>
    <div id="product" class="product"></div>

    <section class="reviews">
        <div class="reviews-heading">
            <h2>Ratings &amp; reviews</h2>
            <label class="sort-control">Sort reviews
                <select id="sort-reviews" aria-label="Sort reviews">
                    <option value="newest">Newest first</option>
                    <option value="oldest">Oldest first</option>
                    <option value="rating-desc">Highest rating</option>
                    <option value="rating-asc">Lowest rating</option>
                </select>
            </label>
        </div>
        <div id="summary" class="summary"></div>
        <div id="reviews"></div>
        <div id="pager" class="pager"></div>
    </section>
</main>

<div th:replace="~{fragments :: footer}"></div>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/product.js}"></script>
</body>
</html>
