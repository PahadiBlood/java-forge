<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Search products')}"></head>
<body>
<div th:replace="~{fragments :: header}"></div>

<main class="container">
    <header class="search-page-head">
        <h1>Search products</h1>
        <p id="search-caption">Find something you’ll love.</p>
    </header>
    <div class="category-tools search-tools">
        <div id="search-count" class="muted" aria-live="polite"></div>
        <label class="sort-control">Sort by
            <select id="sort-search" aria-label="Sort search results">
                <option value="relevance">Relevance</option>
                <option value="name-asc">Name: A to Z</option>
                <option value="price-asc">Price: low to high</option>
                <option value="price-desc">Price: high to low</option>
            </select>
        </label>
    </div>
    <div id="search-grid" class="grid"></div>
    <div id="search-pager" class="pager"></div>
</main>

<div th:replace="~{fragments :: footer}"></div>
<script th:src="@{/js/common.js}"></script>
<script th:src="@{/js/search.js}"></script>
</body>
</html>
